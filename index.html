<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SS Restaurant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #fffaf5;
      color: #333;
    }

    nav {
      background-color: #8b0000;
      padding: 15px;
      position: sticky;
      top: 0;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    header {
      background: url('https://images.unsplash.com/photo-1528605248644-14dd04022da1') center/cover no-repeat;
      height: 70vh;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    section {
      padding: 60px 10%;
    }

    .section-title {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 30px;
      color: #8b0000;
    }

    .nonveg-icons {
      text-align: center;
      margin-bottom: 25px;
    }

    .nonveg-icons img {
      width: 40px;
      margin: 0 10px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .menu-item {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }

    footer {
      background-color: #8b0000;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<nav>
  <a href="#menu">Menu</a>
  <a href="#contact">Contact</a>
</nav>

<header>
  <h1>SS Restaurant</h1>
  <p>Delicious Food | Great Taste</p>
</header>

<section id="menu">
  <h2 class="section-title">Non-Veg Starters</h2>

  <!-- ✅ NON-VEG IMAGES -->
  <div class="nonveg-icons">
    <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" alt="Chicken">
    <img src="https://cdn-icons-png.flaticon.com/512/3082/3082049.png" alt="Fish">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" alt="Prawns">
  </div>

  <div class="menu">
    <div class="menu-item"><h3>Chicken Pakoda</h3><p>₹100 / ₹200</p></div>
    <div class="menu-item"><h3>Chilli Chicken</h3><p>₹120 / ₹250</p></div>
    <div class="menu-item"><h3>Chicken 65</h3><p>₹120 / ₹250</p></div>
    <div class="menu-item"><h3>Fish Fry</h3><p>₹100</p></div>
    <div class="menu-item"><h3>Prawns Pakoda</h3><p>₹280</p></div>
  </div>
</section>

<section id="contact">
  <h2 class="section-title">Contact Us</h2>
  <p style="text-align:center;">📍 Bhimavaram | 📞 7680076821</p>
</section>

<footer>
  <p>© 2025 SS Restaurant</p>
</footer>

</body>
</html>
